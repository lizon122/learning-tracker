<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Commiada-L">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commiada-L</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <nav id="app-sidebar">
    <div class="sidebar-logo">📚 Commiada<span>-L</span></div>
    <div class="nav-item active" data-route="dashboard" onclick="LPA.Router.navigate('dashboard')">
      <span class="nav-icon">📊</span> 学习仪表盘
    </div>
    <div class="nav-item" data-route="courses" onclick="LPA.Router.navigate('courses')">
      <span class="nav-icon">📖</span> 课程管理
    </div>
    <div class="nav-item" data-route="timer" onclick="LPA.Router.navigate('timer')">
      <span class="nav-icon">⏱️</span> 学习计时
    </div>
    <div class="nav-item" data-route="analytics" onclick="LPA.Router.navigate('analytics')">
      <span class="nav-icon">📈</span> 数据分析
    </div>
    <div class="nav-item" data-route="settings" onclick="LPA.Router.navigate('settings')">
      <span class="nav-icon">⚙️</span> 设置
    </div>
  </nav>
  <main id="app-main">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;">
      <div style="text-align:center;color:var(--color-text-muted);">
        <div style="font-size:3rem;margin-bottom:12px;">📚</div>
        <p style="font-size:1.1rem;">加载中...</p>
      </div>
    </div>
  </main>
</div>

<div id="auth-container"></div>
<script src="js/github-auth.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/courses.js"></script>
<script src="js/timer.js"></script>
<script src="js/analytics.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<!-- Fallback: if app.js fails, at least show the error -->
<script>
setTimeout(function() {
  var main = document.getElementById('app-main');
  if (main && main.textContent.trim().indexOf('加载中') !== -1) {
    main.innerHTML = '<div style="padding:40px;text-align:center;"><h2>⚠️ 启动失败</h2><p style="color:#64748b;margin:12px 0;">脚本加载可能超时，请检查控制台 (F12) 查看错误</p><button onclick="localStorage.clear();location.reload();" style="margin:12px;background:#ef4444;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:1rem;">🔄 清除数据并重新加载</button><button onclick="location.reload();" style="margin:12px;background:var(--color-primary);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:1rem;">🔄 直接重新加载</button></div>';
  }
}, 3000);
</script>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").then(function() {
    console.log("SW registered");
  }).catch(function(e) {
    console.log("SW failed:", e);
  });
}
</script>

</body>
</html>
